# Push-Point CI — 머지 게이트 (main 룰셋의 required status check "ci")
# 최소한의 "코드 망가짐 방지": 포맷 → 빌드 → vet → race 테스트 → 계약 드리프트 → enum 정합
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - uses: extractions/setup-just@v2

      - name: gofmt 검사 (수정 없이 위반만 검출)
        run: |
          out=$(gofmt -l backend)
          if [ -n "$out" ]; then echo "gofmt 위반:"; echo "$out"; exit 1; fi

      - name: 빌드
        working-directory: backend
        run: go build ./...

      - name: go vet
        working-directory: backend
        run: go vet ./...

      - name: 테스트 (race)
        working-directory: backend
        run: go test -race ./...

      - name: 계약 드리프트 검사 (just gen-check)
        run: |
          go install github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.8.0
          just gen-check

      # 계약의 세 번째 소비자(iOS)도 드리프트를 검사한다. 완전한 재생성은 macOS +
      # Swift가 필요해 여기 못 넣으므로, 어느 계약에서 생성했는지 스탬프만 대조한다 —
      # 실제로 일어나는 드리프트는 "스펙을 고치고 iOS 재생성을 잊음"이고 그건 잡힌다.
      - name: iOS 생성물 계약 스탬프 검사 (just ios-stamp-check)
        run: just ios-stamp-check

      - name: enum 정합 검사 (openapi.yaml ↔ migrations CHECK)
        run: |
          if [ -f scripts/lint_enums.sh ]; then bash scripts/lint_enums.sh; else echo "lint_enums.sh 없음 — 건너뜀"; fi

      - name: 사전 자산 정합 검사 (nlu/dictionary ↔ 시드 마이그레이션)
        run: |
          if [ -f scripts/lint_dict.sh ]; then bash scripts/lint_dict.sh; else echo "lint_dict.sh 없음 — 건너뜀"; fi

  # 웹 프론트 — openapi.yaml의 3번째 소비자. 계약 드리프트 차단 + 빌드 (backend gen-check와 대칭)
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: extractions/setup-just@v2

      - name: 의존성 설치
        working-directory: frontend
        run: npm ci

      - name: 계약 드리프트 검사 (just web-gen-check)
        run: just web-gen-check

      - name: 린트 (oxlint)
        working-directory: frontend
        run: npm run lint

      - name: 타입 체크 (tsc --noEmit)
        working-directory: frontend
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: 웹 빌드 (just web-build)
        run: just web-build

      # 릴리스 전용 경로(embed_frontend) 검증 — ci job은 태그 없이 빌드하므로
      # spa.go가 컴파일조차 되지 않는다. dist가 생긴 지금(위 web-build 직후)만
      # 이 태그로 빌드·테스트할 수 있다.
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: embed 빌드 (go build -tags embed_frontend)
        working-directory: backend
        run: go build -tags embed_frontend ./...

      - name: embed 테스트 (go test -tags embed_frontend)
        working-directory: backend
        run: go test -count=1 -tags embed_frontend ./internal/web/... ./internal/api/...
