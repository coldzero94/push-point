<!doctype html>
<meta charset="utf-8" />
<title>Push-Point 저장 설정</title>
<style>
  body { font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
         max-width: 34rem; margin: 2rem auto; padding: 0 1rem; color: #1b1c1b; }
  h1 { font-size: 1.05rem; margin: 0 0 1.5rem; }
  label { display: block; margin: 1rem 0 .35rem; font-weight: 600; }
  input { width: 100%; padding: .5rem .6rem; border: 1px solid #cfd3d0; border-radius: .4rem;
          font: inherit; box-sizing: border-box; }
  button { margin-top: 1.25rem; padding: .5rem 1rem; border: 0; border-radius: .4rem;
           background: #197459; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  p.hint { color: #5a615c; margin: .35rem 0 0; font-size: .86rem; }
  #status { margin-top: 1rem; min-height: 1.4rem; }
  @media (prefers-color-scheme: dark) {
    body { background: #14171a; color: #e6e9e7; }
    input { background: #1d2124; border-color: #333a3d; color: inherit; }
    p.hint { color: #9aa3a0; }
  }
</style>
<h1>Push-Point 저장 설정</h1>

<label for="origin">서버 주소</label>
<input id="origin" type="url" placeholder="http://127.0.0.1:8420" />
<p class="hint">웹 앱 설정 화면의 “확장 설정값”에서 그대로 복사할 수 있습니다.</p>

<label for="key">API 키</label>
<input id="key" type="password" placeholder="dev-key" />
<p class="hint">키는 이 확장의 저장소에만 있고, 방문하는 웹페이지는 접근할 수 없습니다.</p>

<button id="save">저장하고 권한 요청</button>
<div id="status" role="status"></div>

<script src="options.js"></script>
