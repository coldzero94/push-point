openapi: 3.1.0

info:
  title: Push-Point API
  version: 0.1.0
  description: |
    Push-Point v2 HTTP API의 기계 원본(contract-first). 단일 사용자 앱이며 정적 Bearer API 키 1개(`PUSHPOINT_API_KEY`)로 인증한다.

    이 문서가 API의 단일 진실 원천이다 — `docs/v2/ko/06-API-SPECIFICATION.md`(사람용 해설)와 다르면 이 파일이 우선한다.
    시간 필드는 전부 unix epoch 초 단위 정수다. `GET /debug/pprof/*`(Go 표준 프로파일링)는 서버가 서빙하지만 계약 대상이 아니다.

servers:
  - url: http://localhost:8420

security:
  - bearerAuth: []

tags:
  - name: system
    description: 헬스체크
  - name: links
    description: 링크 저장·조회·수정
  - name: tags
    description: 통제된 태그 사전 관리
  - name: search
    description: FTS5 전문 검색 (3자 미만은 LIKE 폴백)
  - name: stats
    description: 통계 (iOS 위젯용 — 위젯 활용은 M6)
  - name: thumbs
    description: 썸네일 정적 서빙
  - name: sheets
    description: Google 스프레드시트 내보내기 (단방향 — SQLite가 원본)

paths:
  /healthz:
    get:
      operationId: healthz
      tags: [system]
      summary: 헬스체크
      description: 프로세스 생존 확인. 인증 없음.
      security: []
      responses:
        "200":
          description: 프로세스 정상
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
                    const: ok
              example:
                status: ok

  /api/v1/links:
    get:
      operationId: listLinks
      tags: [links]
      summary: 링크 목록 조회
      description: >
        keyset 커서 페이지네이션 (OFFSET 금지). `(created_at, id)` 인덱스를 타므로
        링크 10만 건에서도 p99 < 50ms.
      parameters:
        - $ref: "#/components/parameters/Cursor"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/TagFilter"
        - name: status
          in: query
          description: 링크 상태 필터
          schema:
            $ref: "#/components/schemas/LinkStatus"
        - name: unopened
          in: query
          description: >-
            `true`면 아직 열지 않은 링크만. 양방향 불리언이 아니다 — "다시 읽은 것" 필터는
            쓰이지 않는다. 부분 인덱스가 있어 keyset 커서가 그대로 탄다.
          schema:
            type: boolean
      responses:
        "200":
          description: 링크 목록 페이지
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createLink
      tags: [links]
      summary: 링크 저장
      description: >
        `INSERT INTO links` + `INSERT INTO jobs(kind='scrape')`를 한 트랜잭션으로 커밋하고
        즉시 응답한다 (p99 < 50ms). 스크랩·태깅·썸네일은 백그라운드 잡으로 처리된다.
        `url_hash`(SHA-256(url)) 기반으로 멱등하다 — 클라이언트가 같은 요청을 재시도해도
        중복 생성이 없다 (중복 시 200 `duplicate:true`).
        소프트 삭제된 링크의 URL을 다시 저장하면 같은 행을 복원(pending 복귀, note 교체,
        scrape 재-enqueue)하고 신규 저장처럼 201로 응답한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkInput"
      responses:
        "201":
          description: 신규 저장 완료 (scrape 잡 enqueue됨)
          content:
            application/json:
              schema:
                type: object
                required: [id, status, created_at]
                properties:
                  id:
                    type: integer
                  status:
                    $ref: "#/components/schemas/LinkStatus"
                  created_at:
                    $ref: "#/components/schemas/EpochSeconds"
              example:
                id: 1234
                status: pending
                created_at: 1752980000
        "200":
          description: >-
            동일 `url_hash`가 이미 존재 — 새로 만들지 않고 기존 id를 반환한다. 저장된 본문이
            서버 출처인데 요청이 클라이언트 본문(body_text)을 실어 오면 제목·설명·본문을 **1회
            보충**하고 태깅을 다시 돌린다(이미 클라이언트 본문이면 아무것도 하지 않는다).
            반복 호출은 같은 상태로 수렴하므로 재시도는 여전히 안전하다.
          content:
            application/json:
              schema:
                type: object
                required: [id, duplicate]
                properties:
                  id:
                    type: integer
                  duplicate:
                    type: boolean
                    const: true
              example:
                id: 987
                duplicate: true
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/links/{id}:
    parameters:
      - $ref: "#/components/parameters/LinkId"
    get:
      operationId: getLink
      tags: [links]
      summary: 링크 상세 조회
      description: 목록 항목 전체 필드 + author, published_at, duration_sec, word_count, lang, error, jobs 요약.
      responses:
        "200":
          description: 링크 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    patch:
      operationId: updateLink
      tags: [links]
      summary: 링크 수정 (메모/태그)
      description: >
        `note` 전달 시 메모 교체. `tags`(태그 이름 배열) 전달 시 이 링크의 태그를 전체 교체한다 —
        추가분은 `link_tags(source='manual', confidence=NULL)` + `tag_feedback(added)`,
        제거분은 `tag_feedback(removed)` 기록. tag_feedback은 M5 재랭킹 학습 데이터다.
        `tags`가 `null`이거나 생략되면 태그를 유지하고, 빈 배열 `[]`이면 전체 제거로 처리한다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkUpdateInput"
      responses:
        "200":
          description: 수정 반영된 링크 상세
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LinkDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteLink
      tags: [links]
      summary: 링크 삭제 (소프트)
      description: 소프트 삭제 — `deleted_at`만 기록하며 행은 남는다. 이후 목록/검색/상세에서 제외된다.
      responses:
        "204":
          description: 삭제 완료 (본문 없음)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/links/resurfaced:
    get:
      operationId: getResurfaced
      tags: [links]
      summary: 오늘의 한 건
      description: >
        잊고 있던 링크 **하나**를 돌려준다. 저장은 한 탭에 끝나는데 돌아오는 절반은
        만든 적이 없었다 — 아카이브의 문은 하나뿐이고 그 문은 늘 최신 것부터 보여준다.

        고르는 규칙: 아직 한 번도 열지 않았고(`opened_at IS NULL`), 저장한 지 일주일이
        지났고, 삭제되지 않은 것. 그중 **하루 동안 같은 하나**를 고른다 — 새로고침할
        때마다 바뀌면 그건 추천이 아니라 슬롯머신이고, 오늘 안 읽고 넘긴 것이 내일
        다시 오지 않으면 되살리는 의미가 없다.

        후보가 없으면 `204`다. 빈 카드를 그리지 않기 위해서다 — 아카이브가 작거나 전부
        읽은 사용자에게 "오늘의 한 건: 없음"은 알려줄 것이 없는 자리다.

        **횟수를 세거나 순환하지 않는다.** 상태를 새로 만들지 않고 이미 있는 열
        (`opened_at`, `created_at`)만 본다. 저장을 열면 그 링크는 후보에서 자연히 빠진다.
      responses:
        "200":
          description: 오늘의 한 건
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Link"
        "204":
          description: 되살릴 링크가 없다 (본문 없음)
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/links/{id}/open:
    post:
      operationId: markOpened
      tags: [links]
      summary: 열람 기록
      description: >
        이 링크를 열었다는 사실만 기록한다(`opened_at`). 클라이언트는 fire-and-forget으로
        부르고 실패해도 재시도하지 않는다 — 저장 경로 밖이라 p99 게이트와 무관하고,
        한 번 놓친 열람 기록이 아카이브를 손상시키지 않는다.

        **횟수는 세지 않는다.** 이 신호는 푸시포인트를 통과한 열람만 잡으므로(브라우저
        히스토리·원본 앱 직접 열기는 잡히지 않는다) 구조적으로 과소집계이고, 비율이나
        지표로 쓰면 틀린 결론을 만든다. 링크별 사실로만 쓴다.
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "204":
          description: 기록 완료 (본문 없음)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/links/{id}/retry:
    post:
      operationId: retryLink
      tags: [links]
      summary: 실패 링크 재시도
      description: >
        `status='failed'`인 링크의 잡을 다시 enqueue한다. 링크는 `pending`으로 되돌아가고
        워커가 처음부터 다시 처리한다. `failed` 상태가 아닌 링크는 400.
      parameters:
        - $ref: "#/components/parameters/LinkId"
      responses:
        "202":
          description: 재-enqueue 수락
          content:
            application/json:
              schema:
                type: object
                required: [id, status]
                properties:
                  id:
                    type: integer
                  status:
                    $ref: "#/components/schemas/LinkStatus"
              example:
                id: 1234
                status: pending
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tags:
    get:
      operationId: listTags
      tags: [tags]
      summary: 태그 사전 조회
      description: >-
        통제된 태그 사전 전체 + 사용 수(`link_count`, 삭제되지 않은 링크 기준).
        `facet`은 여기에만 실린다 — `LinkTag`에는 없으므로 클라이언트가 이 응답을 `Map<tagId, facet>`으로
        캐시해 목록 행의 칩 색을 해석한다 (링크당 태그 수만큼 페이로드가 늘어나는 것을 피한다).
      responses:
        "200":
          description: 태그 사전
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tag"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"
    post:
      operationId: createTag
      tags: [tags]
      summary: 태그 생성
      description: >-
        `name`은 대소문자 무시 UNIQUE — 중복이면 400.
        `facet`은 optional이며 생략하면 `neutral`이다 (클라이언트가 칩 색을 고르는 유일한 입력).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: "#/components/schemas/TagInput"
                - required: [name]
      responses:
        "201":
          description: 생성된 태그
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/tags/{id}:
    parameters:
      - $ref: "#/components/parameters/TagId"
    patch:
      operationId: updateTag
      tags: [tags]
      summary: 태그 수정
      description: >
        `name`, `aliases`, `facet` 모두 optional (전달한 필드만 교체). `aliases`는 규칙 기반 태거의 매칭 대상 —
        alias를 잘 채우는 것이 태깅 정확도를 올리는 가장 싼 방법이다.
        `facet`은 태그 분류 축이며, 이 값을 바꾸면 모든 클라이언트에서 그 태그의 칩 색이 바뀐다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TagInput"
      responses:
        "200":
          description: 수정된 태그
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tag"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      operationId: deleteTag
      tags: [tags]
      summary: 태그 삭제
      description: 사전에서 제거한다. `link_tags` 연결은 FK CASCADE로 함께 삭제된다.
      responses:
        "204":
          description: 삭제 완료 (본문 없음)
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/search:
    get:
      operationId: search
      tags: [search]
      summary: 검색
      description: >
        `q`가 3자 이상이면 FTS5 trigram MATCH + bm25 랭킹 (응답 `mode: "fts"`).
        3자 미만은 에러(400)가 아니라 LIKE 폴백이다 — links 테이블의 title/note/description을
        LIKE 스캔(`%`·`_` ESCAPE 처리)하고 `created_at DESC` 정렬, 응답 `mode: "like"`에
        모든 항목의 `rank`는 null (실측 10만 행 풀스캔 37ms로 예산 내).
      parameters:
        - name: q
          in: query
          required: true
          description: 검색어. 3자 이상 = FTS5, 3자 미만 = LIKE 폴백 (400 아님).
          schema:
            type: string
            minLength: 1
        - $ref: "#/components/parameters/TagFilter"
        - name: from
          in: query
          description: created_at 범위 시작 (unix epoch 초)
          schema:
            type: integer
        - name: to
          in: query
          description: created_at 범위 끝 (unix epoch 초)
          schema:
            type: integer
        - name: cursor
          in: query
          description: >-
            이전 응답의 `next_cursor` 값. 첫 페이지는 생략. 불투명(opaque) 토큰 —
            목록 커서와 검색 커서는 형식이 달라 서로 호환되지 않는다 (형식 불일치는 400).
            FTS 모드 커서는 bm25 rank 기반이라 페이지 사이에 쓰기가 발생하면 FTS 페이지
            경계가 이동할 수 있다 (단일 사용자 규모에서 허용).
          schema:
            type: string
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: 검색 결과 페이지 (`mode`로 검색 경로 표시)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sheets:
    get:
      operationId: getSheetsStatus
      tags: [sheets]
      summary: 스프레드시트 연결 상태
      description: >
        Google 스프레드시트 연결 여부와 마지막 동기화 결과. 연결은 CLI(`pushpoint sheets-setup`)에서
        하고 이 API는 **상태 조회와 실행만** 한다 — 연결에는 브라우저에서 구글 승인을 밟는
        단계가 있어 서버가 대신할 수 없다.
      responses:
        "200":
          description: 연결 상태
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/sheets/sync:
    post:
      operationId: syncSheets
      tags: [sheets]
      summary: 지금 동기화
      description: >
        아카이브 전량을 시트에 다시 쓴다(교체). 동기 호출이며 링크 수에 비례해 몇 초 걸릴
        수 있다 — 저장 API가 아니므로 p99 게이트 대상이 아니다. 연결돼 있지 않으면 409.
      responses:
        "200":
          description: 동기화 결과
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SheetsStatus"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          description: 아직 연결되지 않음 (`pushpoint sheets-setup` 필요)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          $ref: "#/components/responses/InternalError"

  /api/v1/stats:
    get:
      operationId: getStats
      tags: [stats]
      summary: 통계 조회
      description: iOS 위젯용 데이터를 한 번의 호출로 제공한다 (구현 완료 — 위젯 활용은 M6).
      responses:
        "200":
          description: 통계
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Stats"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "500":
          $ref: "#/components/responses/InternalError"

  /thumbs/{dir}/{file}:
    get:
      operationId: getThumb
      tags: [thumbs]
      summary: 썸네일 정적 서빙
      description: >
        `data/thumbs/` 아래의 썸네일 JPEG(단일 사이즈, 최대 폭 640px, q80)를 그대로 서빙한다.
        경로 형식은 `{url_hash 앞 2자리}/{url_hash}.jpg` — 목록/상세 응답의 `thumb_url`이
        정확히 이 경로를 가리킨다. 인증 면제 — Tailscale이 네트워크 경계를 이루고,
        iOS AsyncImage가 커스텀 헤더를 지원하지 않기 때문이다.
      security: []
      parameters:
        - name: dir
          in: path
          required: true
          description: "url_hash 앞 2자리 (hex)"
          schema:
            type: string
            pattern: "^[0-9a-f]{2}$"
          example: a3
        - name: file
          in: path
          required: true
          description: "`{url_hash}.jpg` 파일명"
          schema:
            type: string
            pattern: "^[0-9a-f]{64}\\.jpg$"
          example: a3f1b2c4d5e6f7a8a3f1b2c4d5e6f7a8a3f1b2c4d5e6f7a8a3f1b2c4d5e6f7a8.jpg
      responses:
        "200":
          description: 썸네일 이미지
          content:
            image/jpeg:
              schema:
                type: string
                contentMediaType: image/jpeg
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "정적 API 키 1개 (`PUSHPOINT_API_KEY`). `Authorization: Bearer {key}`"

  parameters:
    LinkId:
      name: id
      in: path
      required: true
      description: 링크 id
      schema:
        type: integer
    TagId:
      name: id
      in: path
      required: true
      description: 태그 id
      schema:
        type: integer
    Cursor:
      name: cursor
      in: query
      description: 이전 응답의 `next_cursor` 값. 첫 페이지는 생략. 불투명(opaque) 토큰.
      schema:
        type: string
    Limit:
      name: limit
      in: query
      description: 페이지 크기
      schema:
        type: integer
        default: 20
        minimum: 1
        maximum: 100
    TagFilter:
      name: tag
      in: query
      description: 태그 이름 필터
      schema:
        type: string

  responses:
    BadRequest:
      description: 잘못된 요청 (`invalid_input`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: invalid_input
              message: url is required
    Unauthorized:
      description: API 키 누락 또는 불일치 (`unauthorized`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: unauthorized
              message: invalid api key
    NotFound:
      description: 리소스 없음 — 소프트 삭제된 링크 포함 (`not_found`)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: not_found
              message: link not found
    InternalError:
      description: >-
        서버 내부 오류 (`internal`) — 핸들러가 처리하지 못한 에러의 공통 종착점이다.
        `GET /healthz`만 이 응답이 없다 (조건 없는 단일 반환이라 실패 경로가 없다).
        `GET /thumbs/{dir}/{file}`은 인증만 면제일 뿐 500 면제는 아니다 — 파일 열기·stat 실패 시 500을 낸다.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          example:
            error:
              code: internal
              message: internal server error

  schemas:
    EpochSeconds:
      type: integer
      description: unix epoch seconds

    EpochSecondsNullable:
      type: [integer, "null"]
      description: unix epoch seconds

    LinkStatus:
      type: string
      description: 링크 처리 파이프라인 상태
      enum: [pending, scraping, tagging, done, failed]

    ContentType:
      type: string
      description: 도메인·URL 패턴 휴리스틱으로 판정한 콘텐츠 종류
      enum: [video, article, post, other]

    JobStatus:
      type: string
      description: 잡 상태
      enum: [pending, running, done, failed]

    TagFacet:
      type: string
      description: >-
        태그 분류 축. 클라이언트는 이 값만으로 칩 색 토큰을 고른다 (색 값 자체는 계약에 없다 —
        라이트/다크 2벌이라 표현은 각 클라이언트가 소유한다). 사전에 없는 새 태그는 neutral로 태어난다.
        생략 시 동작은 오퍼레이션마다 다르다 — `createTag`는 `neutral`로 생성하고, `updateTag`는 기존 값을 유지한다.
        (그래서 이 스키마에는 `default`를 두지 않는다. 두면 PATCH에서 "생략 = neutral"로 잘못 읽힌다.)
      enum: [craft, media, life, neutral]

    LinkTag:
      type: object
      description: 링크에 부착된 태그 (부착 출처·신뢰도 포함)
      required: [id, name, source, confidence]
      properties:
        id:
          type: integer
        name:
          type: string
        source:
          type: string
          description: 부착 출처 — rules(Phase A) / embed(Phase B) / manual(사용자)
          enum: [rules, embed, manual]
        confidence:
          type: [number, "null"]
          description: 태거의 신뢰 점수. manual이면 null

    Link:
      type: object
      description: 링크 목록 항목
      required:
        [id, url, domain, title, description, content_type, thumb_url, status, tags, note,
         created_at, error, retry_state]
      properties:
        id:
          type: integer
        url:
          type: string
        domain:
          type: string
        title:
          type: string
        description:
          type: string
          description: 목록에서는 200자로 절단 (전체는 상세 조회)
        content_type:
          $ref: "#/components/schemas/ContentType"
        thumb_url:
          type: [string, "null"]
          description: "`/thumbs/{dir}/{file}` 형태의 서버 상대 경로. 썸네일 없으면 null"
        status:
          $ref: "#/components/schemas/LinkStatus"
        tags:
          type: array
          items:
            $ref: "#/components/schemas/LinkTag"
        note:
          type: string
          description: 개인 메모
        created_at:
          $ref: "#/components/schemas/EpochSeconds"
        error:
          type: string
          description: >-
            최종 실패 사유. 실패가 없으면 빈 문자열. **`LinkDetail`에만 있던 것을 목록으로
            올린 것이다** — `status=failed` 목록의 행이 "수집하지 못했습니다"라는 같은 문장만
            반복하고 있어서, 무엇이 잘못됐는지 보려면 링크마다 상세를 열어야 했다.
        retry_state:
          $ref: "#/components/schemas/RetryState"

    RetryState:
      type: string
      enum: [none, waiting, exhausted]
      description: >-
        실패한 링크가 **아직 다시 시도되는가**. 실패가 아니면 `none`.

        `waiting`은 백오프로 잠깐 누워 있는 것(`run_after`가 미래)이고 `exhausted`는 시도를
        다 쓴 것(`attempts >= max_attempts`)이다. **지금까지 화면에서 이 둘이 똑같이 생겼다** —
        곧 다시 붙을 링크와 영영 죽은 링크가 구분되지 않아서, 기다리면 되는 것에 사람이
        재시도를 누르고 죽은 것은 그대로 남았다.

    LinkDetail:
      description: 링크 상세 — 목록 항목 전체 필드 + 메타·에러·잡 요약
      allOf:
        - $ref: "#/components/schemas/Link"
        - type: object
          required: [author, published_at, duration_sec, word_count, lang, summary, error, jobs, opened_at]
          properties:
            author:
              type: string
            summary:
              type: string
              description: >-
                본문에서 고른 핵심 문장 2~3개를 개행으로 이은 추출식 요약 (LLM 없이 원문
                문장을 그대로 선택하므로 환각 0). 본문이 얇거나 산문이 부족하거나 description과
                사실상 같으면 빈 문자열이며, 그때 클라이언트는 요약 영역을 그리지 않는다.
                목록(Link)·검색(SearchResult)에는 싣지 않는다 — 요약은 원문 대체재가 아니라
                "열까 말까"의 판단 보조다
            published_at:
              $ref: "#/components/schemas/EpochSecondsNullable"
            duration_sec:
              type: [integer, "null"]
            word_count:
              type: [integer, "null"]
            lang:
              type: string
            opened_at:
              description: >-
                마지막으로 이 링크를 연 시각. 한 번도 안 열었으면 null. **목록 항목(`Link`)에는
                넣지 않는다** — 카드에 표시할 자리가 없으므로(상태는 2px 레일뿐) 목록
                페이로드를 키울 이유가 없다.

                **`oneOf: [EpochSeconds, "null"]`을 쓰지 않는다.** swift-openapi-generator가
                `type: "null"` 갈래를 지원하지 않아 *"Schema "null" is not supported … skipping"*
                경고와 함께 **그 프로퍼티를 통째로 뺀다.** 생성은 성공으로 끝나므로,
                oapi-codegen과 openapi-typescript는 필드를 만들고 Swift만 없는 상태가 되고
                아무 게이트도 그걸 잡지 않는다 — 2026-07-30에 `last_saved_at`을 같은 형태로
                썼다가 발견했고, 이 필드는 그때까지 **iOS에 없는 채로 있었다.**
                `type: [integer, "null"]`인 `EpochSecondsNullable`은 세 생성기가 모두 낸다.
              $ref: "#/components/schemas/EpochSecondsNullable"
            error:
              type: string
              description: 최종 실패 사유. 실패 없으면 빈 문자열
            jobs:
              type: object
              description: >-
                이 링크에 연결된 잡 상태 요약. 해당 kind의 잡이 아직 없으면 필드 생략
                (scrape 잡은 저장 트랜잭션에서 항상 생성되므로 필수). thumb은 best-effort —
                failed여도 링크 status에 영향 없음
              required: [scrape]
              properties:
                scrape:
                  $ref: "#/components/schemas/JobStatus"
                tag:
                  $ref: "#/components/schemas/JobStatus"
                thumb:
                  $ref: "#/components/schemas/JobStatus"

    LinkInput:
      type: object
      description: >-
        링크 저장 요청. title·description·body_text는 **클라이언트 캡처**용 optional 필드다 —
        서버가 fetch할 수 없는 페이지(SPA·봇 차단·로그인 벽)에서 이미 렌더된 콘텐츠를 가진
        클라이언트(브라우저 확장·iOS Share Extension)가 함께 보낸다. 서버는 길이를 **절단**할 뿐
        초과를 400으로 거부하지 않는다(클라이언트가 룬/바이트 경계를 서버와 맞출 방법이 없다).
      required: [url]
      properties:
        url:
          type: string
        note:
          type: string
          description: 개인 메모 (optional)
        title:
          type: string
          description: 클라이언트가 캡처한 제목 (optional, 512바이트로 절단)
        description:
          type: string
          description: 클라이언트가 캡처한 설명 (optional, 2048바이트로 절단)
        body_text:
          type: string
          description: >-
            클라이언트가 추출한 본문 평문 (optional, 32KB로 절단). 값이 있으면 서버는 이 링크의
            본문 출처를 'client'로 표시하고, 이후 스크랩이 제목·설명·본문을 덮어쓰지 않는다.
            태깅·요약이 이 본문을 입력으로 쓴다 — 그래서 스크랩이 실패해도 태그·요약이 나온다.
        keywords:
          type: string
          description: >-
            발행자가 스스로 붙인 분류 (optional, 512바이트로 절단). `meta[name=keywords]`,
            `news_keywords`, `article:section`, `article:tag`, JSON-LD `articleSection`을
            모아 콤마로 이어 붙인 값이다. **도메인 맵과 달리 사이트별 등록이 필요 없다** —
            발행자가 알려주는 값이라 등록되지 않은 사이트에서도 동작한다. 태거가 제목과
            같은 가중치를 준다. 서버도 스크랩할 때 같은 값을 뽑으므로, 이 필드는 서버가
            fetch할 수 없는 페이지를 위한 것이다 (title·description·body_text와 같은 이유).

    LinkUpdateInput:
      type: object
      description: 링크 수정 요청 — note는 교체, tags는 전체 교체 (부분 추가/삭제 API 없음)
      properties:
        note:
          type: string
        tags:
          type: array
          description: 태그 이름 배열. 존재하지 않는 태그 이름이면 400
          items:
            type: string

    SheetsStatus:
      type: object
      description: 스프레드시트 연결 상태와 마지막 동기화 결과
      required: [connected]
      properties:
        connected:
          type: boolean
          description: 연결됐는지. false면 나머지 필드는 비어 있다
        sheet_url:
          type: string
          description: 시트 주소. 없으면 빈 문자열
        last_sync_at:
          type: [integer, "null"]
          description: 마지막 동기화 시각(unix epoch 초). 한 번도 안 했으면 null
        last_rows:
          type: integer
          description: 마지막에 쓴 링크 수
        last_error:
          type: string
          description: 마지막 동기화가 실패했다면 그 이유. 성공했으면 빈 문자열

    LinkPage:
      type: object
      description: 커서 페이지네이션 응답 래퍼
      required: [links, next_cursor]
      properties:
        links:
          type: array
          items:
            $ref: "#/components/schemas/Link"
        next_cursor:
          type: [string, "null"]
          description: 다음 페이지 커서. null이면 마지막 페이지

    SearchResult:
      description: 검색 결과 항목 — 목록 항목 + bm25 rank
      allOf:
        - $ref: "#/components/schemas/Link"
        - type: object
          required: [rank]
          properties:
            rank:
              type: [number, "null"]
              description: "bm25 점수 (낮을수록 관련도 높음). mode가 like면 null"

    SearchPage:
      type: object
      description: 검색 응답 래퍼 — 커서 페이지네이션 + 검색 경로(mode)
      required: [mode, links, next_cursor]
      properties:
        mode:
          type: string
          description: "검색 경로: q 3자 이상 = fts (FTS5 MATCH + bm25), 3자 미만 = like (LIKE 폴백, created_at DESC)"
          enum: [fts, like]
        links:
          type: array
          items:
            $ref: "#/components/schemas/SearchResult"
        next_cursor:
          type: [string, "null"]
          description: 다음 페이지 커서. null이면 마지막 페이지

    Tag:
      type: object
      description: 태그 사전 항목 + 사용 수
      required: [id, name, aliases, link_count, facet, last_saved_at]
      properties:
        id:
          type: integer
        name:
          type: string
          description: 태그 이름 (대소문자 무시 UNIQUE)
        aliases:
          type: array
          description: 동의어·영문/한글 표기 — Phase A 문자열 매칭의 재료
          items:
            type: string
        link_count:
          type: integer
          description: 이 태그가 붙은 (삭제되지 않은) 링크 수
        facet:
          $ref: "#/components/schemas/TagFacet"
        last_saved_at:
          description: >-
            이 태그가 붙은 링크 중 가장 최근 저장 시각. 붙은 링크가 없으면 null.

            **추세가 아니라 신선도다.** 두 달 전에 끊긴 주제와 이번 주 주제가 태그 목록에서
            같은 자리에 섞여 있는 것이 실제 통증이었고, 그건 비교가 아니라 **태그당 날짜
            하나**로 답해진다(12 §4.2). 증감·화살표·상승/하락은 여기서 파생하지 않는다.

            타입이 `oneOf`가 아닌 이유는 아래 `opened_at` 주석과 같다.
          $ref: "#/components/schemas/EpochSecondsNullable"

    TagInput:
      type: object
      description: 태그 생성/수정 요청 (생성 시 name 필수)
      properties:
        name:
          type: string
        aliases:
          type: array
          items:
            type: string
        facet:
          $ref: "#/components/schemas/TagFacet"

    Stats:
      type: object
      description: |
        통계 응답. iOS 통계 탭·웹 설정의 리듬 섹션이 소비한다 (위젯 활용은 M6).
      required: [total_links, links_this_week, failed_links, by_tag, by_day]
      properties:
        total_links:
          type: integer
        links_this_week:
          type: integer
          description: |
            by_day 창의 **마지막 7칸 합** — 오늘 포함 최근 7일.
            화면이 이 값과 by_day에서 파생한 "지난주 대비"를 한 문장 안에 나란히
            놓으므로 기준이 같아야 한다.
        failed_links:
          type: integer
          description: >-
            `status=failed`인 (삭제되지 않은) 링크 수. **실패한 링크는 통계가 아니라 할 일이라**
            이 수는 그 목록으로 가는 입구다 — iOS는 이미 별도 요청으로 세고 있었고 웹에는
            그 수단이 없어서, 같은 화면이 한쪽에만 있었다(13 §2).
        by_tag:
          type: array
          items:
            type: object
            required: [name, count]
            properties:
              name:
                type: string
              count:
                type: integer
        by_day:
          type: array
          minItems: 30
          maxItems: 30
          description: |
            최근 30일 일별 저장 수. **세 가지를 보장한다**:

            1. 항상 정확히 30개 — 저장이 없는 날도 count 0으로 들어 있다
            2. date 오름차순
            3. 마지막 원소가 **서버 로컬타임 기준 오늘**

            이 보장이 없던 시절에는 GROUP BY 결과를 그대로 줘서 빈 날의 행이
            아예 없었고, 배열을 위치로 인덱싱한 클라이언트가 조용히 틀렸다
            (웹·iOS 둘 다 그랬다 — 2026-07-28). 3번 덕분에 클라이언트는 "오늘"을
            자기 타임존으로 추측할 필요가 없다: 뒤에서부터 세면 된다.
          items:
            type: object
            required: [date, count]
            properties:
              date:
                type: string
                pattern: '^\d{4}-\d{2}-\d{2}$'
                # format: date는 일부러 쓰지 않는다 — oapi-codegen이 types.Date(=time.Time)를
                # 만들어 내는데, 스토어는 SQLite date()가 낸 문자열을 그대로 넘긴다.
                # 굳이 time.Time으로 왕복시키면 실패할 수 없는 파싱의 실패 경로만 생긴다.
                description: "YYYY-MM-DD (서버 로컬타임)"
              count:
                type: integer

    Error:
      type: object
      description: 공통 에러 형식 — 코드는 4개가 전부 (단일 사용자라 forbidden/rate_limit 없음)
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [unauthorized, not_found, invalid_input, internal]
            message:
              type: string
