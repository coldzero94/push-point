<!--
  16·32px 전용 광학 변형 — 같은 마크를 작은 크기에서 살리기 위한 것.

  마스터(mark.svg)를 16px로 축소하면 **채움 0의 획이 먼저 죽는다** — 24/1024 획이
  16px에서는 0.4px이라 회색 선 한 줄이 되고, 사다리 3단이 2단으로 보인다.
  실제로 렌더해서 확인한 결과다(2026-07-28).

  그래서 여기서는 획을 굵히고(24 → 52) 간격을 벌리고(50 → 62) 칸 수를 줄이지 않는다.
  **디자인을 단순화하는 대신 획을 키운다** — 3단이라는 사실 자체가 이 마크의 의미이므로
  거기를 깎으면 남는 게 없다.

  이것은 별개 디자인이 아니라 **같은 마크의 광학 크기(optical size)** 다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0F2C22"/>
  <g stroke="#2EB88F" stroke-width="52">
    <rect x="196" y="222" width="632" height="164" rx="40" fill="none"/>
    <rect x="196" y="448" width="632" height="164" rx="40" fill="#2EB88F" fill-opacity="0.34"/>
    <rect x="196" y="674" width="632" height="164" rx="40" fill="#2EB88F"/>
  </g>
</svg>
