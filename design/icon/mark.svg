<!--
  Push-Point 아이덴티티 마크 — 채움 사다리 (10 §1.2 R1 / §1.1)

  같은 형태 셋이 채움 0 → 1 → 2로 놓인다. 이것이 디자인 시스템의 중심 주장 그대로다:
  **"색조는 무엇에 관한 것인지를, 채움은 누가 손댔는지를 말한다."**
  위는 기계가 뱉은 것(획만), 가운데는 사람이 붙인 것(tint), 아래는 사용자가 고른 것(solid).

  **hue는 하나뿐이다.** 세 칸이 전부 accent(#2EB88F, hue 168)이고 달라지는 것은 채움뿐이다.
  색을 셋 다 다르게 쓰면 R1을 정면으로 어긴다 — 첫 시안이 그랬고 고쳤다.

  이 파일이 소스다. 모든 출력물은 `just icons`(scripts/gen_icons.sh)가 여기서 생성한다.
  치수를 바꾸려면 여기를 고치고 재생성한다. 생성물은 직접 편집하지 않는다.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <rect width="1024" height="1024" fill="#0F2C22"/>
  <g stroke="#2EB88F" stroke-width="24">
    <!-- 채움 0 — 기계 출력 -->
    <rect x="248" y="268" width="528" height="136" rx="32" fill="none"/>
    <!-- 채움 1 — 사람이 붙임 -->
    <rect x="248" y="454" width="528" height="136" rx="32" fill="#2EB88F" fill-opacity="0.30"/>
    <!-- 채움 2 — 사용자가 선택함 -->
    <rect x="248" y="640" width="528" height="136" rx="32" fill="#2EB88F"/>
  </g>
</svg>
