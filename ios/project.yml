# XcodeGen 스펙 — 이 파일이 소스이고 PushPoint.xcodeproj는 생성물이다(`just ios-gen`).
#
# .xcodeproj를 커밋하지 않는 이유: pbxproj는 UUID 덩어리라 diff가 읽히지 않고 병합 충돌이
# 잦다. 프로젝트 구조 변경은 여기를 고쳐 리뷰 가능한 diff로 남긴다 — api/openapi.yaml이
# 생성물의 소스인 것과 같은 규칙이다.
name: PushPoint

options:
  bundleIdPrefix: com.pushpoint
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko

# 생성된 API 클라이언트(PushPoint/Generated/)가 쓰는 런타임.
# 생성기 자체는 SPM 빌드 플러그인이 아니라 CLI로 돌린다(.claude/rules/api.md) —
# 여기 두 패키지는 **생성물이 컴파일되기 위한 런타임**이지 생성기가 아니다.
packages:
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.0.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 시뮬레이터 빌드는 서명이 필요 없다 — Apple 계정 없이 전 기능을 개발·검증할 수 있고,
    # 실기기에 올릴 때만 개발 팀이 필요해진다.
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # 팀 ID는 사람마다 다르고 개인 계정에 묶인 값이라 커밋하지 않는다.
    # `just ios-device` 가 PUSHPOINT_TEAM_ID 를 넘겨 준다(비어 있으면 시뮬레이터 경로에는
    # 아무 영향이 없다 — 시뮬레이터는 ad-hoc 서명으로 돌기 때문).
    DEVELOPMENT_TEAM: ${PUSHPOINT_TEAM_ID}

# 스킴을 명시하는 이유: XcodeGen이 자동 생성한 스킴은 앱에 의존하는 타깃만 테스트
# 액션에 담는데, PushPointTests는 앱과 링크되지 않는 순수 단위 테스트라 빠졌다.
# 그래서 `CoverPatternTests`가 리포에 있으면서 **한 번도 실행되지 않았다** — 웹과
# iOS의 커버 해시가 갈라져도 양쪽 다 정상으로 보이므로 눈으로는 절대 안 잡히는데,
# 그걸 잡으라고 만든 테스트가 잠들어 있었다.
schemes:
  PushPoint:
    build:
      targets:
        PushPoint: all
    test:
      targets:
        - PushPointTests
        - PushPointUITests
    run:
      config: Debug

targets:
  # 웹과 값이 갈라지면 안 되는 것들(생성 커버 해시)을 고정하는 자리.
  # 화면 코드가 아니라 규칙을 테스트한다.
  PushPointTests:
    type: bundle.unit-test
    platform: iOS
    # 폰트 파일 자체를 테스트가 열어 본다 — DesignSystem이 부르는 PostScript 이름이
    # 파일에 실재하는지 확인하기 위해서다(FontNameTests).
    #
    # XcodeGen에는 타깃 `resources:` 키가 **없다**. sources 항목에 buildPhase를 지정해야
    # 하고, 그렇게 하지 않으면 조용히 무시된다 — 실제로 그렇게 돼서 테스트가 폰트를
    # 못 찾고 전부 Helvetica로 떨어졌다(2026-07-28).
    sources:
      - path: PushPointTests
      - path: Shared
      # 피드 모델과 그것이 쓰는 생성 타입. **뷰는 넣지 않는다** — 화면을 끌어들이면
      # 단위 테스트가 아니게 되고, 이 모델을 뷰에서 떼어 낸 이유가 사라진다.
      - path: PushPoint/FeedModel.swift
      - path: PushPoint/ListFilter.swift
      # 공유 첨부 → 계약 필드 규칙. **확장 타깃과 같은 파일**을 컴파일한다 —
      # 복사본을 두면 갈라져도 양쪽 다 초록으로 보인다(streak에서 겪은 그것).
      - path: PushPointShare/SharePayload.swift
      - path: PushPoint/Generated
      - path: PushPoint/Resources/Fonts
        buildPhase: resources
      # 상대 시각 기준값 — **웹과 같은 파일을 읽는다.** 주장으로 두면 갈라져도 양쪽 다
      # 정상으로 보이고, streak에서 그 문제를 이미 겪었다(13 §3).
      - path: ../testdata/relative-time-cases.json
        buildPhase: resources
      # 커버 기하 — **웹의 covers.test.ts와 같은 파일.** 손으로 옮겨 적은 골든을 쓰다가
      # 웹이 갈라진 것을 2026-08-03까지 아무도 못 봤다.
      - path: ../testdata/cover-cases.json
        buildPhase: resources
      # 커버 **그림**(도형 목록) — 웹이 생성하고 웹 테스트도 같은 파일을 읽는다.
      # cover-cases.json이 파라미터를, 이쪽이 표시 자체를 맞춘다.
      - path: ../testdata/cover-ops.json
        buildPhase: resources
      # 상태 라벨 — 웹과 같은 파일. §8.1이 "같은 단어"를 요구하는데 검사가 없었다.
      - path: ../testdata/status-labels.json
        buildPhase: resources
      - path: ../testdata/facet-labels.json
        buildPhase: resources
      # 되살림 카드가 보드에 미치는 영향 — 웹 src/lib/board.test.ts와 같은 파일.
      # 이 규칙은 이미 한 번 갈렸고(웹 `!tag` vs iOS `필터 없음`), 양쪽 화면이 각각은
      # 멀쩡해 보였다. 결과를 나란히 놓는 것 말고 잡을 방법이 없었다.
      - path: ../testdata/resurface-board-cases.json
        buildPhase: resources
      # facet 라벨을 **직접 부르기 위해** 넣는다. 상태 라벨은 뷰의 private var라 소스를
      # 훑는 약한 검사였는데, 이쪽은 열거형이라 실제 함수를 호출할 수 있다.
      - path: PushPoint/DesignSystem.swift
      # 상태 라벨 규칙 — 웹과 글자까지 같아야 한다(13 §3). 뷰 밖에 있어야 부를 수 있다.
      - path: PushPoint/StatusAnnounce.swift
    dependencies:
      # 생성 타입이 OpenAPIRuntime 타입(HTTPBody 등)을 참조하므로 Types.swift만 넣어도
      # 링크가 필요하다. 스텁은 APIProtocol만 구현하지만 타입 자체가 런타임에 묶여 있다.
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pushpoint.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # 화면을 **실제로 조작해** 검증한다. 단위 테스트(PushPointTests)가 규칙을 고정한다면
  # 여기는 "탭하면 무슨 일이 일어나는가"를 고정한다 — 목록·검색·태그 편집처럼 코드를
  # 읽어서는 알 수 없고 지금까지 사람 눈으로만 확인하던 자리다.
  #
  # 앱은 `-uitest` 인자로 뜬다: App Group이 아니라 임시 디렉터리를 쓰고 픽스처를 스스로
  # 넣으므로, 시뮬레이터에 무엇이 들어 있든 결과가 같고 사용자 데이터는 건드리지 않는다.
  PushPointUITests:
    type: bundle.ui-testing
    platform: iOS
    # 실행 인자 문자열은 앱과 공유한다 — 양쪽에 따로 적으면 한쪽만 고쳤을 때
    # 플래그가 조용히 안 먹고, 그 실패는 "기능이 없다"와 구분되지 않는다.
    sources: [PushPointUITests, Shared/UITestModeFlags.swift]
    dependencies:
      - target: PushPoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pushpoint.app.uitests
        GENERATE_INFOPLIST_FILE: YES

  PushPoint:
    type: application
    platform: iOS
    # 서체는 웹과 같은 파일에서 나온다(§10 2.2.1). 웹은 woff2, iOS는 ttf —
    # iOS 텍스트 시스템이 woff2를 읽지 못해서 같은 원본을 변환해 둔 것뿐이다.
    # PushPoint/ 아래에 있으므로 sources 스캔이 리소스로 자동 분류한다.
    sources: [PushPoint, Shared]
    dependencies:
      # 확장은 앱 번들 안에 들어간다 — XcodeGen이 app-extension 타입을 자동으로 임베드한다.
      - target: PushPointShare
      # gomobile 산출물은 **정적** 아카이브다(ar archive). 링크만 하면 되고 번들에
      # 복사하면 안 된다 — embed: true면 "정적 프레임워크를 임베드했다"는 검증 오류가 난다.
      - framework: Frameworks/PPCore.xcframework
        embed: false
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIURLSession
        product: OpenAPIURLSession
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pushpoint.app
        CODE_SIGN_ENTITLEMENTS: PushPoint/PushPoint.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Push-Point
        # 알림 배너·홈 화면에 쓰이는 아이콘. 없으면 배너 왼쪽이 빈 격자로 나온다.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PushPoint/Info.plist
      properties:
        CFBundleDisplayName: Push-Point
        UILaunchScreen: {}
        # 인프로세스 서버는 127.0.0.1 평문 HTTP다. ATS가 루프백을 막지 않도록 명시한다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 등록하지 않으면 Font.custom이 조용히 시스템 폰트로 떨어진다 — 빌드도 통과하고
        # 화면만 다르게 나오는 종류라, 값이 틀리면 눈으로만 잡힌다.
        UIAppFonts:
          - WantedSans-Variable.ttf
          - GeistMono-Variable.ttf

  PushPointShare:
    type: app-extension
    platform: iOS
    sources: [PushPointShare, Shared]
    dependencies:
      - framework: Frameworks/PPShare.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pushpoint.app.share
        CODE_SIGN_ENTITLEMENTS: PushPointShare/PushPointShare.entitlements
    info:
      path: PushPointShare/Info.plist
      properties:
        CFBundleDisplayName: Push-Point
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Safari 공유는 이 JS 전처리 파일이 페이지 DOM에서 본문을 뽑아 넘긴다 —
            # 브라우저 확장과 **같은 규칙 파일**이다(extension/src/extract.js에서 복사).
            NSExtensionJavaScriptPreprocessingFile: extract
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
