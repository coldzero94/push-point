# XcodeGen 스펙 — 이 파일이 소스이고 PushPoint.xcodeproj는 생성물이다(`just ios-gen`).
#
# .xcodeproj를 커밋하지 않는 이유: pbxproj는 UUID 덩어리라 diff가 읽히지 않고 병합 충돌이
# 잦다. 프로젝트 구조 변경은 여기를 고쳐 리뷰 가능한 diff로 남긴다 — api/openapi.yaml이
# 생성물의 소스인 것과 같은 규칙이다.
name: PushPoint

options:
  bundleIdPrefix: com.pushpoint
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: ko

# 생성된 API 클라이언트(PushPoint/Generated/)가 쓰는 런타임.
# 생성기 자체는 SPM 빌드 플러그인이 아니라 CLI로 돌린다(.claude/rules/api.md) —
# 여기 두 패키지는 **생성물이 컴파일되기 위한 런타임**이지 생성기가 아니다.
packages:
  OpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    from: 1.0.0
  OpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    from: 1.0.0

settings:
  base:
    SWIFT_VERSION: "5.0"
    # 시뮬레이터 빌드는 서명이 필요 없다 — Apple 계정 없이 전 기능을 개발·검증할 수 있고,
    # 실기기에 올릴 때만 개발 팀이 필요해진다.
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  # 웹과 값이 갈라지면 안 되는 것들(생성 커버 해시)을 고정하는 자리.
  # 화면 코드가 아니라 규칙을 테스트한다.
  PushPointTests:
    type: bundle.unit-test
    platform: iOS
    sources: [PushPointTests, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pushpoint.app.tests
        GENERATE_INFOPLIST_FILE: YES

  # 화면을 **실제로 조작해** 검증한다. 단위 테스트(PushPointTests)가 규칙을 고정한다면
  # 여기는 "탭하면 무슨 일이 일어나는가"를 고정한다 — 목록·검색·태그 편집처럼 코드를
  # 읽어서는 알 수 없고 지금까지 사람 눈으로만 확인하던 자리다.
  #
  # 앱은 `-uitest` 인자로 뜬다: App Group이 아니라 임시 디렉터리를 쓰고 픽스처를 스스로
  # 넣으므로, 시뮬레이터에 무엇이 들어 있든 결과가 같고 사용자 데이터는 건드리지 않는다.
  PushPointUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PushPointUITests]
    dependencies:
      - target: PushPoint
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pushpoint.app.uitests
        GENERATE_INFOPLIST_FILE: YES

  PushPoint:
    type: application
    platform: iOS
    sources: [PushPoint, Shared]
    dependencies:
      # 확장은 앱 번들 안에 들어간다 — XcodeGen이 app-extension 타입을 자동으로 임베드한다.
      - target: PushPointShare
      # gomobile 산출물은 **정적** 아카이브다(ar archive). 링크만 하면 되고 번들에
      # 복사하면 안 된다 — embed: true면 "정적 프레임워크를 임베드했다"는 검증 오류가 난다.
      - framework: Frameworks/PPCore.xcframework
        embed: false
      - package: OpenAPIRuntime
        product: OpenAPIRuntime
      - package: OpenAPIURLSession
        product: OpenAPIURLSession
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pushpoint.app
        CODE_SIGN_ENTITLEMENTS: PushPoint/PushPoint.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Push-Point
        # 알림 배너·홈 화면에 쓰이는 아이콘. 없으면 배너 왼쪽이 빈 격자로 나온다.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: PushPoint/Info.plist
      properties:
        CFBundleDisplayName: Push-Point
        UILaunchScreen: {}
        # 인프로세스 서버는 127.0.0.1 평문 HTTP다. ATS가 루프백을 막지 않도록 명시한다.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  PushPointShare:
    type: app-extension
    platform: iOS
    sources: [PushPointShare, Shared]
    dependencies:
      - framework: Frameworks/PPShare.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pushpoint.app.share
        CODE_SIGN_ENTITLEMENTS: PushPointShare/PushPointShare.entitlements
    info:
      path: PushPointShare/Info.plist
      properties:
        CFBundleDisplayName: Push-Point
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            # Safari 공유는 이 JS 전처리 파일이 페이지 DOM에서 본문을 뽑아 넘긴다 —
            # 브라우저 확장과 **같은 규칙 파일**이다(extension/src/extract.js에서 복사).
            NSExtensionJavaScriptPreprocessingFile: extract
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsWebPageWithMaxCount: 1
              NSExtensionActivationSupportsText: true
